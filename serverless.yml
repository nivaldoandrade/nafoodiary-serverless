# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: nivaldoandrade
# "service" is the name of this project. This will also be added to your AWS resource names.
service: api

custom:
  cognito:
    UserPoolName: ${self:service}-${sls:stage}-UserPool

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  memorySize: 128
  region: sa-east-1
  environment: ${file(./sls/config/env.yml)}
  iam:
    role: ${file(./sls/config/role.yml)}
  httpApi:
    authorizers:
      CognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt UserPool.ProviderURL
        audience:
          - !Ref UserPoolClient

  # Uncomment to easily set up a custom domain. Read the docs for more details:
  # https://www.serverless.com/framework/docs/providers/aws/guide/domains
  # domain: api.example.com

package:
  individually: true

build:
  esbuild:
    configFile: ./esbuild.config.mjs

resources:
  - ${file(./sls/resources/userPool.yaml)}
  - ${file(./sls/resources/mainTable.yml)}

functions:
  - ${file(./sls/functions/hello.yaml)}
  - ${file(./sls/functions/auth.yaml)}


